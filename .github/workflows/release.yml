# Publishes a release when a version tag is pushed: builds main.js from this
# commit, attests main.js / manifest.json / styles.css (verify with
# `gh attestation verify <file> --repo centifanto/MarkTodo-plugin`), and uploads them.
# Tag with the bare version in manifest.json (e.g. 0.0.2), as Obsidian expects.
name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write # create the release
  id-token: write # sign the attestation
  attestations: write # store it
  artifact-metadata: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # No dependency cache: this job can publish, so it never restores one.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile

      - name: Tag matches manifest.json
        run: test "$(node -p 'require("./manifest.json").version')" = "$GITHUB_REF_NAME"

      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

      - uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      # The body comes from docs/release-notes/<version>.md when that file exists,
      # so a release reads the way it was written in the commit and never has to
      # be edited on GitHub afterwards. gh PREPENDS it to the generated notes, so
      # the commit list and the Full Changelog link still sit underneath it.
      # No file (a release that needs no prose) falls back to generated notes
      # alone — a missing file must not fail a run whose tag is already pushed.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/release-notes/$GITHUB_REF_NAME.md"
          if [ -f "$notes" ]; then
            gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css \
              --title "$GITHUB_REF_NAME" --notes-file "$notes" --generate-notes
          else
            gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css \
              --title "$GITHUB_REF_NAME" --generate-notes
          fi
